<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <title>~pinyi</title>
</head>

<body>
  <!-- CRT pixel misalignment (the "smudge" you liked from the first version): a
       smooth feTurbulence field drives feDisplacementMap at a small scale, so
       pixels shift a hair organically — text stays sharp and clear (no blur,
       no background noise), just a subtle painted misalignment. Uses in-filter
       turbulence directly (no feImage / external PNG → Safari-friendly), no
       radial barrel (no corner distortion), region pinned to the box (no
       offset "ghost"). -->
  <svg class="defs-only" aria-hidden="true" focusable="false">
    <defs>
      <filter id="crt-smudge" color-interpolation-filters="sRGB"
              x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="1" seed="5" result="noise"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"
                           xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
      </filter>
    </defs>
  </svg>
  <div id="app">
    <div id="term-host">
      <header class="pixel-heading" aria-label="Alden Jin">
        <pre aria-hidden="true"> ▄▀█ █   █▀▄ █▀▀ █▄ █   ░░█ █ █▄ █
 █▀█ █▄▄ █▄▀ ██▄ █ ▀█   █▄█ █ █ ▀█</pre>
      </header>
      <nav class="mobile-nav" aria-label="Pages">
        <button data-command="index">home</button>
        <button data-command="bio">bio</button>
        <button data-command="projects">projects</button>
        <button data-command="works">works</button>
        <button data-command="tao">tao</button>
        <button data-command="help">help</button>
      </nav>
      <div id="term-screen"></div>
      <div class="input-tools">
        <span class="prompt-hint">type 'help' to explore</span>
        <div class="mobile-keys">
          <button data-key="history" aria-label="Previous command">↑</button>
          <button data-key="complete">Tab</button>
          <button data-command="clear">clear</button>
        </div>
      </div>
      <footer class="signature">TWO IS PHILOSOPHY.</footer>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
